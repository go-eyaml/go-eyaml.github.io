baseURL = "https://go-eyaml.github.io/"
title = "go-eyaml"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Token format"
  status = "ready"
  blurb = "`IsToken` / `ParseToken` / `FormatToken` for the `ENC[PKCS7,<base64>]` tokens hiera-eyaml embeds in YAML, tolerant of whitespace-wrapped values."
[[params.phases]]
  name = "PKCS7 encryptor"
  status = "ready"
  blurb = "A random AES-256 content key (AES-256-CBC, PKCS#7 padding) wrapped with RSA PKCS#1 v1.5 under an X.509 certificate, serialised as a CMS EnvelopedData `ContentInfo` — mirroring hiera-eyaml's `pkcs7` encryptor."
[[params.phases]]
  name = "Key management"
  status = "ready"
  blurb = "`CreateKeys` generates the RSA keypair and self-signed certificate that `eyaml createkeys` produces; `LoadPrivateKey` / `LoadCertificate` read PEM / PKCS8 material."
[[params.phases]]
  name = "Standard-library crypto only"
  status = "ready"
  blurb = "Built on `crypto/rsa`, `crypto/x509`, `crypto/aes`, `crypto/cipher`, `crypto/rand`, `encoding/pem` and `encoding/asn1`; the PKCS#7 / CMS structure is hand-assembled — no third-party crypto, no cgo."
[[params.phases]]
  name = "Pluggable schemes (gpg)"
  status = "planned"
  blurb = "`Encryptor` is a seam; the hiera-eyaml `gpg` scheme is intentionally deferred, as it would pull in OpenPGP machinery beyond the standard-library crypto surface."
