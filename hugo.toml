baseURL = "https://go-eyaml.github.io/"
title = "go-eyaml"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Token format"
  status = "ready"
  blurb = "`IsToken` / `ParseToken` / `FormatToken` for the `ENC[PKCS7,<base64>]` tokens hiera-eyaml embeds in YAML, tolerant of whitespace-wrapped values."
[[params.phases]]
  name = "PKCS7 encryptor"
  status = "ready"
  blurb = "A random AES-256 content key (AES-256-CBC, PKCS#7 padding) wrapped with RSA PKCS#1 v1.5 under an X.509 certificate, serialised as a CMS EnvelopedData `ContentInfo` — mirroring hiera-eyaml's `pkcs7` encryptor."
[[params.phases]]
  name = "Key management"
  status = "ready"
  blurb = "`CreateKeys` generates the RSA keypair and self-signed certificate that `eyaml createkeys` produces; `LoadPrivateKey` / `LoadCertificate` read PEM / PKCS8 material; `LoadGPGKeyRing` reads OpenPGP keyring material."
[[params.phases]]
  name = "PKCS7 crypto"
  status = "ready"
  blurb = "Built on `crypto/rsa`, `crypto/x509`, `crypto/aes`, `crypto/cipher`, `crypto/rand`, `encoding/pem` and `encoding/asn1`; the PKCS#7 / CMS structure is hand-assembled — no third-party crypto, no cgo."
[[params.phases]]
  name = "GPG encryptor"
  status = "ready"
  blurb = "`NewGPG` mirrors hiera-eyaml's `gpg` (GPGME) encryptor on the pure-Go, CGO-free `ProtonMail/go-crypto/openpgp`, producing `ENC[GPG,<base64>]` tokens byte-for-byte interoperable with real `gpg --encrypt` / `--decrypt`."
